<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xClaw 登录界面预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f0f5ff 0%, #e6f0ff 50%, #d9e6ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .preview-container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(24, 100, 255, 0.12);
        }

        .preview-title {
            text-align: center;
            margin-bottom: 30px;
            color: #1a1a1a;
        }

        .preview-title h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #1864ff 0%, #4d8aff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .preview-title p {
            color: #666;
            font-size: 16px;
        }

        .design-preview {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .design-item {
            background: #f8faff;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #e0e7ff;
        }

        .design-item h3 {
            color: #1864ff;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 600;
        }

        .design-item ul {
            list-style: none;
        }

        .design-item li {
            margin-bottom: 12px;
            padding-left: 24px;
            position: relative;
            color: #444;
        }

        .design-item li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #1864ff;
            font-weight: bold;
        }

        .color-palette {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .color-item {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 500;
        }

        .color-primary {
            background: #1864ff;
        }

        .color-secondary {
            background: #4d8aff;
        }

        .color-accent {
            background: #f0f5ff;
            color: #1864ff;
        }

        .color-light {
            background: #ffffff;
            color: #1864ff;
            border: 1px solid #e0e7ff;
        }

        .mockup {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px;
            margin-top: 20px;
            box-shadow: 
                0 20px 60px rgba(24, 100, 255, 0.12),
                0 8px 32px rgba(24, 100, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .mockup-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .mockup-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .mockup-title:after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #1864ff, transparent);
            border-radius: 1px;
        }

        .mockup-form {
            max-width: 320px;
            margin: 0 auto;
        }

        .mockup-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e7ff;
            border-radius: 12px;
            background: rgba(240, 245, 255, 0.5);
            margin-bottom: 16px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .mockup-input:focus {
            outline: none;
            border-color: #1864ff;
            box-shadow: 0 0 0 3px rgba(24, 100, 255, 0.2);
        }

        .mockup-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1864ff 0%, #4d8aff 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .mockup-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(24, 100, 255, 0.3);
        }

        .mockup-settings {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(224, 231, 255, 0.6);
        }

        .mockup-settings button {
            background: none;
            border: none;
            color: #8c9bb3;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .mockup-settings button:hover {
            color: #1864ff;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #4d8aff;
            font-size: 14px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .design-preview {
                grid-template-columns: 1fr;
            }
            
            .preview-container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="preview-title">
            <h1>xClaw 登录界面设计预览</h1>
            <p>蓝白清爽风格，渐变、阴影、动画效果</p>
        </div>

        <div class="design-preview">
            <div class="design-item">
                <h3>设计特色</h3>
                <ul>
                    <li>蓝白渐变背景，视觉层次丰富</li>
                    <li>毛玻璃效果卡片，现代感十足</li>
                    <li>小海豚浮动动画，增加趣味性</li>
                    <li>按钮悬停发光效果</li>
                    <li>响应式设计，适配各种设备</li>
                    <li>暗色模式自动适配</li>
                    <li>平滑过渡动画，提升用户体验</li>
                </ul>
            </div>

            <div class="design-item">
                <h3>色彩方案</h3>
                <p>主色调：蓝色系，体现科技感与专业感</p>
                <div class="color-palette">
                    <div class="color-item color-primary">#1864FF</div>
                    <div class="color-item color-secondary">#4D8AFF</div>
                    <div class="color-item color-accent">#F0F5FF</div>
                    <div class="color-item color-light">#FFFFFF</div>
                </div>
                <p style="margin-top: 16px; color: #666;">渐变背景、阴影、边框都使用蓝色系，保持视觉统一</p>
            </div>
        </div>

        <div class="mockup">
            <div class="mockup-header">
                <div class="mockup-title">
                    Hi！您好，我是您的个人AI企业助手<span style="color: #1864ff; font-weight: 700;">xClaw</span>
                </div>
                <div style="height: 60px; position: relative; margin-top: 8px;">
                    <div style="
                        position: absolute;
                        top: 0;
                        left: 50%;
                        transform: translateX(-50%);
                        animation: float 3s ease-in-out infinite;
                        font-size: 40px;
                    ">🐬</div>
                </div>
            </div>

            <div class="mockup-form">
                <input type="text" class="mockup-input" placeholder="登录名" value="admin">
                <input type="password" class="mockup-input" placeholder="密码" value="••••••••">
                <button class="mockup-button">登录</button>
                
                <div class="mockup-settings">
                    <button>⚙️ 设置</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>xClaw 个人AI企业助手 · 让工作更智能，让协作更高效</p>
        </div>
    </div>

    <style>
        @keyframes float {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-8px);
            }
        }
    </style>
</body>
</html>
