version: '3.8'

volumes:
  xclaw-data:
    name: xclaw-data
  xclaw-secrets:
    name: xclaw-secrets

services:
  xclaw:
    image: agentscope/xclaw:latest
    container_name: xclaw
    restart: always
    ports:
      - "127.0.0.1:8088:8088"
    # environment:
    #   - QWENPAW_AUTH_ENABLED=true
    #   - QWENPAW_AUTH_USERNAME=admin
    #   - QWENPAW_AUTH_PASSWORD=yourpassword
    volumes:
      - xclaw-data:/app/working
      - xclaw-secrets:/app/working.secret
