# Build macOS desktop for Apple Silicon only (ARM64).
# Runner: macos-14 (GitHub-hosted Apple Silicon). Produces dist/xClaw-<version>-macOS.zip (.app inside).
#
# Run: Actions → "Desktop (macOS ARM64)" → Run workflow → pick branch → Run.
# Download: open the workflow run → Artifacts → xClaw-Desktop-macOS-ARM64-<version>.

name: Desktop (macOS ARM64)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Host architecture
        run: uname -sm

      - name: Get version
        id: version
        run: echo "version=$(sed -n 's/^__version__[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src/xclaw/__version__.py)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"
          activate-environment: "xclaw-build"
          condarc-file: .github/condarc
          conda-remove-defaults: false

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Build macOS .app (ARM64)
        run: |
          chmod +x scripts/pack/macos/build.sh scripts/pack/build_macos.sh
          conda run -n xclaw-build bash -c 'CREATE_ZIP=1 ./scripts/pack/macos/build.sh'

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: xClaw-Desktop-macOS-ARM64-${{ steps.version.outputs.version }}
          path: dist/xClaw-*.zip
